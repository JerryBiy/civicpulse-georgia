name: Sync Georgia legislative data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicpulse-legislative-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out CivicPulse
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Refresh sessions, bills, and meetings
        run: npm run sync:data
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          CIVICPULSE_SUPABASE_URL: ${{ secrets.CIVICPULSE_SUPABASE_URL }}
          CIVICPULSE_SUPABASE_SECRET_KEY: ${{ secrets.CIVICPULSE_SUPABASE_SECRET_KEY }}
          SYNC_MEETINGS: "true"
